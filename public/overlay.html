<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astradio • Overlay</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background:#0b1322; color:#e6f0ff; font-family: Inter, system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .row { display:grid; gap:12px; grid-template-columns: 1fr; }
    @media (min-width: 900px){ .row.two { grid-template-columns: 1fr 1fr; } }
    .card { background:#111a2e; border:1px solid #203052; border-radius:16px; padding:12px; }
    label { display:block; font-size:12px; opacity:.8; margin:6px 0 4px; }
    input, select, button { background:#0f1728; color:#e6f0ff; border:1px solid #203052; border-radius:10px; padding:10px; width:100%; }
    button.primary { background:#065f46; border-color:#065f46; }
    .bar { display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:10px; }
    .wheelbox { display:flex; align-items:center; justify-content:center; padding:8px; }
    svg { width: 100%; height: 440px; }
    .hidden { display:none !important; }
    .status { font-size:12px; opacity:.8; }

    /* right-align date/time inputs */
    .ta-right { text-align: right; }
    input[type="time"].ta-right::-webkit-datetime-edit-text,
    input[type="time"].ta-right::-webkit-datetime-edit-hour-field,
    input[type="time"].ta-right::-webkit-datetime-edit-minute-field {
      text-align: right;
    }
    input[type="date"].ta-right::-webkit-datetime-edit { text-align: right; }
  </style>
  <script src="https://unpkg.com/tone/build/Tone.js"></script>
  <script defer src="./wheel.js"></script>
  <script defer src="./overlay.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1>Overlay</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <label for="genre" style="margin:0;">Genre</label>
        <select id="genre">
          <option value="ambient">Ambient</option>
          <option value="cinematic">Cinematic</option>
          <option value="lofi">Lo-Fi</option>
          <option value="electronic">Electronic</option>
          <option value="orchestral">Orchestral</option>
        </select>
      </div>
    </div>

    <!-- Inputs ABOVE the two charts -->
    <div class="row two">
      <div class="card">
        <strong>Chart A</strong>
        <!-- Date (native picker, right-aligned) -->
        <label for="a_date">Date</label>
        <input id="a_date" type="date" class="ta-right" />
        <!-- Time (native picker, right-aligned, 15-min suggestions) -->
        <label for="a_time">Time</label>
        <input id="a_time" type="time" class="ta-right" step="60" list="times15a" />
        <datalist id="times15a">
          <option value="00:00"></option><option value="00:15"></option><option value="00:30"></option><option value="00:45"></option>
          <option value="01:00"></option><option value="01:15"></option><option value="01:30"></option><option value="01:45"></option>
          <option value="02:00"></option><option value="02:15"></option><option value="02:30"></option><option value="02:45"></option>
          <option value="03:00"></option><option value="03:15"></option><option value="03:30"></option><option value="03:45"></option>
          <option value="04:00"></option><option value="04:15"></option><option value="04:30"></option><option value="04:45"></option>
          <option value="05:00"></option><option value="05:15"></option><option value="05:30"></option><option value="05:45"></option>
          <option value="06:00"></option><option value="06:15"></option><option value="06:30"></option><option value="06:45"></option>
          <option value="07:00"></option><option value="07:15"></option><option value="07:30"></option><option value="07:45"></option>
          <option value="08:00"></option><option value="08:15"></option><option value="08:30"></option><option value="08:45"></option>
          <option value="09:00"></option><option value="09:15"></option><option value="09:30"></option><option value="09:45"></option>
          <option value="10:00"></option><option value="10:15"></option><option value="10:30"></option><option value="10:45"></option>
          <option value="11:00"></option><option value="11:15"></option><option value="11:30"></option><option value="11:45"></option>
          <option value="12:00"></option><option value="12:15"></option><option value="12:30"></option><option value="12:45"></option>
          <option value="13:00"></option><option value="13:15"></option><option value="13:30"></option><option value="13:45"></option>
          <option value="14:00"></option><option value="14:15"></option><option value="14:30"></option><option value="14:45"></option>
          <option value="15:00"></option><option value="15:15"></option><option value="15:30"></option><option value="15:45"></option>
          <option value="16:00"></option><option value="16:15"></option><option value="16:30"></option><option value="16:45"></option>
          <option value="17:00"></option><option value="17:15"></option><option value="17:30"></option><option value="17:45"></option>
          <option value="18:00"></option><option value="18:15"></option><option value="18:30"></option><option value="18:45"></option>
          <option value="19:00"></option><option value="19:15"></option><option value="19:30"></option><option value="19:45"></option>
          <option value="20:00"></option><option value="20:15"></option><option value="20:30"></option><option value="20:45"></option>
          <option value="21:00"></option><option value="21:15"></option><option value="21:30"></option><option value="21:45"></option>
          <option value="22:00"></option><option value="22:15"></option><option value="22:30"></option><option value="22:45"></option>
          <option value="23:00"></option><option value="23:15"></option><option value="23:30"></option><option value="23:45"></option>
        </datalist>

        <label for="a_place">Place</label>
        <input id="a_place" list="a_places" placeholder="City, Country" />
        <datalist id="a_places"></datalist>
        <input id="a_lat" type="hidden" /><input id="a_lon" type="hidden" />
      </div>

      <div class="card">
        <strong>Chart B</strong>
        <!-- Date -->
        <label for="b_date">Date</label>
        <input id="b_date" type="date" class="ta-right" />
        <!-- Time -->
        <label for="b_time">Time</label>
        <input id="b_time" type="time" class="ta-right" step="60" list="times15b" />
        <datalist id="times15b">
          <option value="00:00"></option><option value="00:15"></option><option value="00:30"></option><option value="00:45"></option>
          <option value="01:00"></option><option value="01:15"></option><option value="01:30"></option><option value="01:45"></option>
          <option value="02:00"></option><option value="02:15"></option><option value="02:30"></option><option value="02:45"></option>
          <option value="03:00"></option><option value="03:15"></option><option value="03:30"></option><option value="03:45"></option>
          <option value="04:00"></option><option value="04:15"></option><option value="04:30"></option><option value="04:45"></option>
          <option value="05:00"></option><option value="05:15"></option><option value="05:30"></option><option value="05:45"></option>
          <option value="06:00"></option><option value="06:15"></option><option value="06:30"></option><option value="06:45"></option>
          <option value="07:00"></option><option value="07:15"></option><option value="07:30"></option><option value="07:45"></option>
          <option value="08:00"></option><option value="08:15"></option><option value="08:30"></option><option value="08:45"></option>
          <option value="09:00"></option><option value="09:15"></option><option value="09:30"></option><option value="09:45"></option>
          <option value="10:00"></option><option value="10:15"></option><option value="10:30"></option><option value="10:45"></option>
          <option value="11:00"></option><option value="11:15"></option><option value="11:30"></option><option value="11:45"></option>
          <option value="12:00"></option><option value="12:15"></option><option value="12:30"></option><option value="12:45"></option>
          <option value="13:00"></option><option value="13:15"></option><option value="13:30"></option><option value="13:45"></option>
          <option value="14:00"></option><option value="14:15"></option><option value="14:30"></option><option value="14:45"></option>
          <option value="15:00"></option><option value="15:15"></option><option value="15:30"></option><option value="15:45"></option>
          <option value="16:00"></option><option value="16:15"></option><option value="16:30"></option><option value="16:45"></option>
          <option value="17:00"></option><option value="17:15"></option><option value="17:30"></option><option value="17:45"></option>
          <option value="18:00"></option><option value="18:15"></option><option value="18:30"></option><option value="18:45"></option>
          <option value="19:00"></option><option value="19:15"></option><option value="19:30"></option><option value="19:45"></option>
          <option value="20:00"></option><option value="20:15"></option><option value="20:30"></option><option value="20:45"></option>
          <option value="21:00"></option><option value="21:15"></option><option value="21:30"></option><option value="21:45"></option>
          <option value="22:00"></option><option value="22:15"></option><option value="22:30"></option><option value="22:45"></option>
          <option value="23:00"></option><option value="23:15"></option><option value="23:30"></option><option value="23:45"></option>
        </datalist>

        <label for="b_place">Place</label>
        <input id="b_place" list="b_places" placeholder="City, Country" />
        <datalist id="b_places"></datalist>
        <input id="b_lat" type="hidden" /><input id="b_lon" type="hidden" />
      </div>
    </div>

    <div class="bar" style="margin-top:12px;">
      <div class="status" id="status">Ready.</div>
      <div style="display:flex; gap:8px;">
        <button id="generate" class="primary">Generate & Play</button>
        <button id="stop">Stop</button>
        <button id="back" class="hidden">Back to edit</button>
      </div>
    </div>

    <!-- Two wheels side-by-side (always visible) -->
    <div id="pair" class="row two">
      <div class="card wheelbox">
        <svg id="wheelA" viewBox="-220 -220 440 440"></svg>
      </div>
      <div class="card wheelbox">
        <svg id="wheelB" viewBox="-220 -220 440 440"></svg>
      </div>
    </div>

    <!-- Combined wheel shown during playback -->
    <div id="combinedWrap" class="card wheelbox hidden" style="margin-top:12px;">
      <svg id="wheel" viewBox="-220 -220 440 440"></svg>
    </div>
  </div>
</body>
</html>
